{% extends 'base.html' %}
{% load i18n %}
{% block content %}
    <h2 class="text-center mb-5" style="color: var(--primary-color);">{% translate "Bize Ulaşın" %}</h2>

    <div class="row justify-content-center">
        <div class="col-md-8">
            {% if mesaj %}
                <div class="alert alert-success text-center">{{ mesaj }}</div>
            {% endif %}

            <form method="post" class="p-4 border rounded shadow-sm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="ad_soyad" class="form-label">{% translate "Ad Soyad" %}</label>
                    <input type="text" class="form-control" id="ad_soyad" name="ad_soyad" required>
                </div>
                <div class="mb-3">
                    <label for="eposta" class="form-label">{% translate "E-posta Adresi" %}</label>
                    <input type="email" class="form-control" id="eposta" name="eposta" required>
                </div>
                <div class="mb-3">
                    <label for="konu" class="form-label">{% translate "Konu" %}</label>
                    <input type="text" class="form-control" id="konu" name="konu" required>
                </div>
                <div class="mb-3">
                    <label for="mesaj" class="form-label">{% translate "Mesajınız" %}</label>
                    <textarea class="form-control" id="mesaj" name="mesaj" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">{% translate "Gönder" %}</button>
            </form>
        </div>
    </div>
{% endblock content %}
